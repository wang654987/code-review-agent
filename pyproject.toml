[project]
name = "code-review-agent"
version = "0.2.0"
description = "AI-powered code review agent with multi-stage analysis pipeline and dual-model cross-validation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "litellm>=1.50.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "tree-sitter>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]
semgrep = [
    "semgrep>=1.0",
]
